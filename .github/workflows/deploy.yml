name: Deploy Trivia App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TRIVIA_HOST }}
          username: ${{ secrets.TRIVIA_USER }}
          key: ${{ secrets.TRIVIA_SSH_KEY }}

          script: |
            set -e

            cd /home/ubuntu/clauds-trivia

            git fetch origin main
            git reset --hard origin/main

            npm ci --omit=dev

            pm2 restart clauds-trivia

            pm2 save